# 作者 shingja · github.com/shingja/shingja-math-modeling-workbench · 双许可见 LICENSE · 含隐形溯源标记
name: 功能建议
description: 新算法、新门禁、新模块或流程改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎具体建议。请勿提交当届赛题的解法与数据；
        若建议引入第三方代码，请先说明其来源与许可。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要它？现在怎么绕过的？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: 涉及的目录
      placeholder: "modules/ · protocols/ · references/paradigms/ · matlab/ · tools/ · gates/"
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法与取舍
