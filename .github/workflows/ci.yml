# 作者 shingja · github.com/shingja/shingja-math-modeling-workbench · 双许可见 LICENSE · 含隐形溯源标记
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 最小权限：CI 只需要读代码
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # action 按 commit SHA 固定，避免上游 tag 被移动导致供应链风险
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装测试依赖 / Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: 获取官方工具（第三方，不入库）/ Fetch official tools
        run: python tools/fetch_official_tools.py

      - name: 隐私与身份信息扫描 / Privacy scan
        run: python tests/test_privacy.py -v

      - name: 归属行完整性 / Attribution
        run: python tests/test_attribution.py -v

      - name: 版本号与引用一致性 / Integrity
        run: python tests/test_skill_integrity.py -v

      - name: 内容哈希校验 / Manifest
        run: python tools/manifest.py --verify

      - name: 全套回归测试 / Full test suite
        run: |
          # 第三方官方工具（docx/xlsx/libreoffice）版本随上游变化，
          # 其集成测试单独维护，不阻塞本仓库 CI。
          for t in tests/test_*.py; do
            case "$t" in
              tests/test_docx_tools.py|tests/test_equations.py|tests/test_paper_format.py|tests/test_recalc.py|tests/test_xlsx_read.py) continue ;;
            esac
            python "$t" -v
          done
